<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Quest</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    padding: 28px 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

header p {
    margin: 0;
    color: #cbd5e1;
}

.container {
    width: min(1000px, 92%);
    margin: 30px auto;
}

/* =========================
   PANELS
========================= */

.panel {
    background: white;
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}

.panel h2 {
    margin-top: 0;
}

/* =========================
   TOPICS
========================= */

.topic-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.topic-button,
.level-button {
    border: 2px solid #d9e0ea;
    background: white;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* Hover effects are limited to devices that actually support hovering.
   This prevents buttons from appearing stuck in a hover state after tapping. */
@media (hover: hover) and (pointer: fine) {
    .topic-button:hover,
    .level-button:hover {
        border-color: #6366f1;
        box-shadow: 0 3px 9px rgba(99, 102, 241, 0.12);
    }

    .topic-button:not(.active):hover,
    .level-button:not(.active):hover {
        transform: translateY(-1px);
    }
}

.topic-button.active,
.level-button.active {
    background: #6366f1;
    color: white;
    border-color: #6366f1;
}

/* =========================
   LEVELS
========================= */

.level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.level-button span {
    display: block;
    font-size: 12px;
    font-weight: normal;
    margin-top: 5px;
    opacity: 0.8;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.05);
}

.stat-label {
    font-size: 12px;
    color: #64748b;
    text-transform: uppercase;
    font-weight: bold;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================
   QUESTION
========================= */

.question-card {
    text-align: center;
}

.question-topic {
    color: #6366f1;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 1px;
}

#question {
    font-size: 34px;
    font-weight: bold;
    margin: 35px 0;
    min-height: 50px;
    line-height: 1.7;
}

/* =========================
   ANSWER
========================= */

#answer {
    width: min(600px, 100%);
    padding: 15px;
    font-size: 20px;
    text-align: center;
    border: 2px solid #d9e0ea;
    border-radius: 12px;
    outline: none;
}

#answer:focus {
    border-color: #6366f1;
}

/* =========================
   BUTTONS
========================= */

.button-row {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.main-button {
    border: none;
    border-radius: 12px;
    padding: 14px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease, box-shadow 0.16s ease, background-color 0.16s ease, opacity 0.16s ease;
}

.check-button {
    background: #6366f1;
    color: white;
}

.new-button {
    background: #e8edf5;
    color: #172033;
}

.shortcut-hint {
    display: inline-block;
    margin-left: 7px;
    padding: 3px 6px;
    border-radius: 6px;
    background: rgba(23, 32, 51, 0.09);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    vertical-align: 1px;
}

.main-button:active,
.topic-button:active,
.level-button:active {
    transform: scale(0.97);
}

.main-button:focus-visible,
.topic-button:focus-visible,
.level-button:focus-visible {
    outline: 3px solid rgba(99, 102, 241, 0.35);
    outline-offset: 3px;
}

@media (hover: hover) and (pointer: fine) {
    .main-button:hover {
        opacity: 0.92;
        box-shadow: 0 4px 12px rgba(23, 32, 51, 0.12);
    }
}

@media (prefers-reduced-motion: reduce) {
    .main-button,
    .topic-button,
    .level-button {
        transition: none;
    }
}

/* =========================
   FEEDBACK
========================= */

#feedback {
    min-height: 45px;
    margin-top: 20px;
    font-size: 17px;
    font-weight: bold;
}

.correct {
    color: #16a34a;
}

.incorrect {
    color: #dc2626;
}

.hint {
    margin-top: 15px;
    color: #64748b;
    font-size: 14px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .topic-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    #question {
        font-size: 26px;
    }
}

@media (max-width: 450px) {

    .topic-grid,
    .level-grid {
        grid-template-columns: 1fr;
    }

    #question {
        font-size: 23px;
    }
}

</style>
</head>


<body>

<header>

    <h1>🧠 Math Quest</h1>

    <p>
        Practice algebra. Build your streak. Master maths.
    </p>

</header>


<div class="container">


<!-- =========================
     TOPIC SELECTION
========================= -->

<div class="panel">

    <h2>Choose a Topic</h2>

    <div class="topic-grid">

        <button
            class="topic-button active"

        </button>

        <button
            class="topic-button"

        </button>

        <button
            class="topic-button"

            Rounding Numbers
        </button>

    </div>

</div>


<!-- =========================
     DIFFICULTY
========================= -->

<div class="panel">

    <h2>Choose Difficulty</h2>

    <div class="level-grid">

        <button
            class="level-button active"
            data-level="1">

            Level 1

            <span>
                Starter
            </span>

        </button>


        <button
            class="level-button"
            data-level="2">

            Level 2

            <span>
                Challenge
            </span>

        </button>


        <button
            class="level-button"
            data-level="3">

            Level 3

            <span>
                Expert
            </span>

        </button>

    </div>

</div>


<!-- =========================
     STATISTICS
========================= -->

<div class="stats">

    <div class="stat">

        <div class="stat-label">
            Score
        </div>

        <div
            class="stat-value"
            id="score">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Streak
        </div>

        <div
            class="stat-value"
            id="streak">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Correct
        </div>

        <div
            class="stat-value"
            id="correct">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Questions
        </div>

        <div
            class="stat-value"
            id="questions">
            0
        </div>

    </div>

</div>


<!-- =========================
     QUESTION
========================= -->

<div class="panel question-card">

    <div
        class="question-topic"
        id="topicName">

        Linear Equations

    </div>


    <div id="question">

        Loading...

    </div>


    <form id="answerForm">

        <input
            type="text"
            id="answer"
            autocomplete="off"
            placeholder="Enter your answer">


        <div class="button-row">

            <button
                type="submit"
                class="main-button check-button">

                Check Answer

            </button>


            <button
                type="button"
                id="newQuestion"
                class="main-button new-button"
                title="Next question (Alt + Right Arrow; or N when not typing)"
                aria-keyshortcuts="Alt+ArrowRight N">

                New Question <span class="shortcut-hint" aria-hidden="true">Alt + →</span>

            </button>

        </div>

    </form>


    <div id="feedback"></div>


    <div class="hint">

        Simultaneous equations:
        <strong>2,3</strong>

        <br>

        Algebra:
        <strong>2(x+1)(x+2)</strong>

        <br>

        Rounding: enter the rounded number (for example, <strong>3.50</strong>).

    </div>

</div>

</div>


<script>

/*
====================================================
MATH QUEST
====================================================

Important feature:

The answer checker does NOT simply compare strings.

It converts algebraic expressions into polynomial
coefficient objects.

For example:

2(x+1)(x+2)

and

2(x+2)(x+1)

both become:

4 + 6x + 2x²

Therefore they are recognised as equivalent.

====================================================
*/


// ==================================================
// GAME STATE
// ==================================================

let currentTopic = "linear";

let currentLevel = 1;

let currentQuestion = null;

let score = 0;

let streak = 0;

let correct = 0;

let questions = 0;

let alreadyAnswered = false;


// ==================================================
// RANDOM NUMBER FUNCTIONS
// ==================================================

function randomNumber(min, max) {

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

}


function randomNonZero(min, max) {

    let number = 0;

    while (number === 0) {

        number = randomNumber(min, max);

    }

    return number;
}


function randomChoice(array) {

    return array[
        randomNumber(0, array.length - 1)
    ];

}


// ==================================================
// NUMBER FORMATTING
// ==================================================

// Adds a sign and formats a constant number.
function signed(number) {

    if (number >= 0) {
        return "+ " + number;
    }

    return "- " + Math.abs(number);
}


// Formats a single algebra term so that:
//  1x  -> x
// -1x  -> -x
//  0x  -> ""
function algebraTerm(coefficient, variable = "x", power = "") {

    if (coefficient === 0) {
        return "";
    }

    const variablePart = variable + power;

    if (coefficient === 1) {
        return variablePart;
    }

    if (coefficient === -1) {
        return "-" + variablePart;
    }

    return coefficient + variablePart;
}


// Formats a polynomial from highest power to lowest power.
// Zero terms are removed and coefficients of 1/-1 are simplified.
function formatPolynomial(coefficients) {

    const powers = Object.keys(coefficients)
        .map(Number)
        .sort((a, b) => b - a);

    const terms = [];

    for (const power of powers) {

        const coefficient = Number(coefficients[power]);

        // Never display zero or invalid terms.
        if (!Number.isFinite(coefficient) || coefficient === 0) {
            continue;
        }

        let variable = "";
        let powerText = "";

        if (power === 1) {
            variable = "x";
        } else if (power > 1) {
            variable = "x";
            powerText =
                power === 2 ? "²" :
                power === 3 ? "³" :
                "^" + power;
        }

        const absCoefficient = Math.abs(coefficient);
        const term = algebraTerm(
            absCoefficient,
            variable,
            powerText
        );

        if (!term) {
            continue;
        }

        if (terms.length === 0) {
            terms.push(coefficient < 0 ? "-" + term : term);
        } else {
            terms.push(
                coefficient < 0
                    ? " - " + term
                    : " + " + term
            );
        }
    }

    // If every coefficient is zero, display 0 rather than a blank.
    return terms.length > 0 ? terms.join("") : "0";
}


// Formats ax + by (used for simultaneous equations).
function formatXYEquation(a, b, constant) {

    let result = "";

    const xTerm = algebraTerm(Math.abs(a), "x");
    const yTerm = algebraTerm(Math.abs(b), "y");

    if (a !== 0) {
        result += a < 0 ? "-" + xTerm : xTerm;
    }

    if (b !== 0) {
        if (result !== "") {
            result += b < 0 ? " - " + yTerm : " + " + yTerm;
        } else {
            result = b < 0 ? "-" + yTerm : yTerm;
        }
    }

    if (result === "") {
        result = "0";
    }

    return result + " = " + constant;
}


// Formats a binomial such as (x + 2), (2x - 3), etc.
function formatBinomial(coefficient, constant) {

    let result = algebraTerm(coefficient, "x");

    if (constant !== 0) {
        result += constant > 0
            ? " + " + constant
            : " - " + Math.abs(constant);
    }

    return result || "0";
}


// ==================================================
// LINEAR EQUATIONS
// ==================================================

function generateLinearQuestion() {

    let x = randomNumber(-10, 10);

    let a;
    let b;
    let c;


    // ----------------------------
    // LEVEL 1
    // ax + b = c
    // ----------------------------

    if (currentLevel === 1) {

        a = randomChoice([1, 2, 3, 4, 5]);
        b = randomNumber(-10, 10);
        c = a * x + b;

        return {
            question:
                formatPolynomial({ 1: a, 0: b }) +
                " = " +
                c,

            answer: x.toString(),
            type: "number"
        };
    }


    // ----------------------------
    // LEVEL 2
    // ax+b = cx+d
    // ----------------------------

    if (currentLevel === 2) {

        a = randomNonZero(-8, 8);

        let cCoefficient = randomNonZero(-6, 6);

        while (cCoefficient === a) {
            cCoefficient = randomNonZero(-6, 6);
        }

        b = randomNumber(-10, 10);

        let d =
            a * x +
            b -
            cCoefficient * x;

        return {
            question:
                formatPolynomial({ 1: a, 0: b }) +
                " = " +
                formatPolynomial({ 1: cCoefficient, 0: d }),

            answer: x.toString(),
            type: "number"
        };
    }


    // ----------------------------
    // LEVEL 3
    // ----------------------------

    a = randomNonZero(-7, 7);

    let cCoefficient = randomNonZero(-6, 6);
    let e = randomNonZero(-5, 5);

    b = randomNumber(-10, 10);

    let d =
        a * x +
        b -
        cCoefficient * x -
        e * x;

    return {
        question:
            formatPolynomial({ 1: a, 0: b }) +
            " = " +
            formatPolynomial({ 1: cCoefficient, 0: d }) +
            " " +
            (e >= 0 ? "+ " : "- ") +
            algebraTerm(Math.abs(e), "x"),

        answer: x.toString(),
        type: "number"
    };

}


// ==================================================
// SIMULTANEOUS EQUATIONS
// ==================================================

function generateSimultaneousQuestion() {

    let x = randomNumber(-6, 6);
    let y = randomNumber(-6, 6);

    let a, b, c, d, e, f;

    do {
        a = randomNonZero(-5, 5);
        b = randomNonZero(-5, 5);
        d = randomNonZero(-5, 5);
        e = randomNonZero(-5, 5);
    } while (a * e === b * d);

    c = a * x + b * y;
    f = d * x + e * y;

    return {
        question:
            formatXYEquation(a, b, c) +
            "<br>" +
            formatXYEquation(d, e, f),

        answer: x + "," + y,
        type: "pair"
    };

}


// ==================================================
// EXPANSION
// ==================================================

function generateExpansionQuestion() {

    let a;
    let b;
    let c;
    let d;


    // ----------------------------
    // LEVEL 1 / 2
    // ----------------------------

    if (currentLevel < 3) {

        a = currentLevel === 1
            ? randomChoice([1, 2, 3])
            : randomNonZero(-5, 5);

        b = randomNumber(-8, 8);

        c = currentLevel === 1
            ? randomChoice([1, 2, 3])
            : randomNonZero(-5, 5);

        d = randomNumber(-8, 8);

        let middle = a * d + b * c;
        let constant = b * d;

        return {
            question:
                "(" + formatBinomial(a, b) + ")" +
                "(" + formatBinomial(c, d) + ")",

            answer:
                formatPolynomial({
                    2: a * c,
                    1: middle,
                    0: constant
                }),

            type: "polynomial"
        };
    }


    // ----------------------------
    // LEVEL 3
    // THREE BRACKETS
    // ----------------------------

    a = randomNonZero(-4, 4);
    b = randomNumber(-6, 6);

    c = randomNonZero(-4, 4);
    d = randomNumber(-6, 6);

    let e = randomNonZero(-3, 3);
    let f = randomNumber(-5, 5);

    let A = a * c * e;

    let B =
        a * c * f +
        a * d * e +
        b * c * e;

    let C =
        a * d * f +
        b * c * f +
        b * d * e;

    let D = b * d * f;

    return {
        question:
            "(" + formatBinomial(a, b) + ")" +
            "(" + formatBinomial(c, d) + ")" +
            "(" + formatBinomial(e, f) + ")",

        answer:
            formatPolynomial({
                3: A,
                2: B,
                1: C,
                0: D
            }),

        type: "polynomial"
    };

}


// ==================================================
// ROUNDING NUMBERS
// ==================================================

function roundToDecimalPlaces(value, places, method) {
    const factor = Math.pow(10, places);
    const scaled = value * factor;
    let rounded;

    if (method === "up") {
        // Round up means move to the next value at the requested precision.
        rounded = Math.ceil(scaled - 1e-10);
    } else if (method === "down") {
        // Round down means remove the extra digits without increasing the value.
        rounded = Math.floor(scaled + 1e-10);
    } else {
        // Round off to the nearest value; ties go up for these positive questions.
        rounded = Math.floor(scaled + 0.5 + 1e-10);
    }

    return (rounded / factor).toFixed(places);
}

function roundToSignificantFigures(value, figures, method) {
    const power = figures - 1 - Math.floor(Math.log10(Math.abs(value)));
    const factor = Math.pow(10, power);
    const scaled = value * factor;
    let rounded;

    if (method === "up") {
        rounded = Math.ceil(scaled - 1e-10);
    } else if (method === "down") {
        rounded = Math.floor(scaled + 1e-10);
    } else {
        rounded = Math.floor(scaled + 0.5 + 1e-10);
    }

    const result = rounded / factor;
    return Number(result.toPrecision(figures)).toString();
}

function generateRoundingQuestion() {
    // Keep the numbers positive so that round up/down have an unambiguous
    // school-maths meaning, and always generate digits beyond the target place.
    const value = randomChoice([
        randomNumber(1001, 999999) / 1000,
        randomNumber(1001, 999999) / 1000,
        randomNumber(101, 999999) / 10000
    ]);
    const method = currentLevel === 1
        ? "nearest"
        : currentLevel === 2
            ? randomChoice(["nearest", "nearest", "up", "down"])
            : randomChoice(["nearest", "up", "down"]);
    const useSignificantFigures = currentLevel === 1
        ? false
        : currentLevel === 2
            ? Math.random() < 0.35
            : Math.random() < 0.5;
    const precision = currentLevel === 1
        ? randomChoice([1, 2])
        : currentLevel === 2
            ? randomChoice([1, 2, 3])
            : randomChoice([1, 2, 3, 4]);

    const operation = method === "nearest"
        ? "round off"
        : method === "up" ? "round up" : "round down";
    let question;
    let answer;

    if (useSignificantFigures) {
        question = operation + " <strong>" + value + "</strong> to <strong>" + precision +
            (precision === 1 ? " significant figure" : " significant figures") + ".";
        answer = roundToSignificantFigures(value, precision, method);
    } else {
        question = operation + " <strong>" + value + "</strong> to <strong>" + precision +
            (precision === 1 ? " decimal place" : " decimal places") + ".";
        answer = roundToDecimalPlaces(value, precision, method);
    }

    return {
        question: question,
        answer: answer,
        type: "number"
    };
}


// ==================================================
// FACTORISATION
// ==================================================

function generateFactorisationQuestion() {

    let p = randomNonZero(-9, 9);
    let q = randomNonZero(-9, 9);

    const middle = p + q;
    const constant = p * q;

    // These are guaranteed to be real numbers because p and q
    // are generated as non-zero integers.
    const basePolynomial = {
        2: 1,
        1: middle,
        0: constant
    };


    // ----------------------------
    // LEVEL 1
    // ----------------------------

    if (currentLevel === 1) {

        return {
            question: formatPolynomial(basePolynomial),

            answer:
                "(" + formatBinomial(1, p) + ")" +
                "(" + formatBinomial(1, q) + ")",

            type: "polynomial"
        };
    }


    // ----------------------------
    // LEVEL 2 / 3
    // ----------------------------

    const commonFactor = currentLevel === 2
        ? randomChoice([2, 3, 4, 5])
        : randomChoice([2, 3, 4, 5, 6]);

    const questionPolynomial = {
        2: commonFactor,
        1: commonFactor * middle,
        0: commonFactor * constant
    };

    return {
        question: formatPolynomial(questionPolynomial),

        answer:
            commonFactor +
            "(" + formatBinomial(1, p) + ")" +
            "(" + formatBinomial(1, q) + ")",

        type: "polynomial"
    };

}


// ==================================================
// POLYNOMIAL ENGINE
// ==================================================

/*
A polynomial is represented as:

{
    0: constant,
    1: coefficient of x,
    2: coefficient of x²,
    3: coefficient of x³
}

Example:

2x² + 6x + 4

becomes:

{
    0: 4,
    1: 6,
    2: 2
}
*/


function zeroPolynomial() {

    return {
        0: 0
    };

}


function clonePolynomial(p) {

    let result = {};

    for (let power in p) {

        result[power] =
            p[power];

    }

    return result;

}


function cleanPolynomial(p) {

    let result = {};

    for (let power in p) {

        let value =
            Math.round(
                p[power] * 1000000000
            ) / 1000000000;


        if (Math.abs(value) > 0.000000001) {

            result[power] = value;

        }

    }


    if (
        Object.keys(result).length === 0
    ) {

        result[0] = 0;

    }


    return result;

}


function addPolynomials(a, b) {

    let result =
        clonePolynomial(a);


    for (let power in b) {

        if (!result[power]) {

            result[power] = 0;

        }

        result[power] +=
            b[power];

    }


    return cleanPolynomial(result);

}


function subtractPolynomials(a, b) {

    let result =
        clonePolynomial(a);


    for (let power in b) {

        if (!result[power]) {

            result[power] = 0;

        }

        result[power] -=
            b[power];

    }


    return cleanPolynomial(result);

}


function multiplyPolynomials(a, b) {

    let result =
        zeroPolynomial();


    for (let powerA in a) {

        for (let powerB in b) {

            let power =
                Number(powerA) +
                Number(powerB);


            if (!result[power]) {

                result[power] = 0;

            }


            result[power] +=
                a[powerA] *
                b[powerB];

        }

    }


    return cleanPolynomial(result);

}


function powerPolynomial(base, exponent) {

    if (exponent < 0) {

        throw new Error(
            "Negative powers are not supported."
        );

    }


    let result = {
        0: 1
    };


    for (
        let i = 0;
        i < exponent;
        i++
    ) {

        result =
            multiplyPolynomials(
                result,
                base
            );

    }


    return result;

}


// ==================================================
// TOKENIZER
// ==================================================

function tokenize(expression) {

    expression =
        expression
            .replace(/\s+/g, "")
            .replace(/−/g, "-")
            .replace(/²/g, "^2")
            .replace(/³/g, "^3")
            .toLowerCase();


    let tokens = [];

    let i = 0;


    while (i < expression.length) {

        let character =
            expression[i];


        // NUMBER

        if (
            /[0-9.]/.test(character)
        ) {

            let number = "";

            while (
                i < expression.length &&
                /[0-9.]/.test(
                    expression[i]
                )
            ) {

                number +=
                    expression[i];

                i++;

            }


            let value =
                Number(number);


            if (
                !Number.isFinite(value)
            ) {

                throw new Error(
                    "Invalid number"
                );

            }


            tokens.push({
                type: "number",
                value: value
            });

            continue;

        }


        // X

        if (character === "x") {

            tokens.push({
                type: "x"
            });

            i++;

            continue;

        }


        // OPERATORS

        if (
            character === "+" ||
            character === "-" ||
            character === "*" ||
            character === "/" ||
            character === "^" ||
            character === "(" ||
            character === ")"
        ) {

            tokens.push({
                type: character
            });

            i++;

            continue;

        }


        throw new Error(
            "Unknown character"
        );

    }


    /*
    Insert implicit multiplication.

    Example:

    2(x+1)

    becomes:

    2 * (x+1)

    And:

    (x+1)(x+2)

    becomes:

    (x+1) * (x+2)
    */

    let output = [];


    function canEndFactor(token) {

        return (
            token.type === "number" ||
            token.type === "x" ||
            token.type === ")"
        );

    }


    function canStartFactor(token) {

        return (
            token.type === "number" ||
            token.type === "x" ||
            token.type === "("
        );

    }


    for (
        let j = 0;
        j < tokens.length;
        j++
    ) {

        let previous =
            tokens[j - 1];

        let current =
            tokens[j];


        if (
            previous &&
            canEndFactor(previous) &&
            canStartFactor(current)
        ) {

            output.push({
                type: "*"
            });

        }


        output.push(current);

    }


    return output;

}


// ==================================================
// POLYNOMIAL PARSER
// ==================================================

function parsePolynomial(expression) {

    let tokens =
        tokenize(expression);

    let position = 0;


    function peek() {

        return tokens[position];

    }


    function consume(type) {

        let token =
            tokens[position];


        if (
            !token ||
            token.type !== type
        ) {

            throw new Error(
                "Unexpected token"
            );

        }


        position++;

        return token;

    }


    // ----------------------------
    // Primary
    // ----------------------------

    function parsePrimary() {

        let token =
            peek();


        if (!token) {

            throw new Error(
                "Unexpected end"
            );

        }


        if (
            token.type === "number"
        ) {

            position++;

            return {
                0: token.value
            };

        }


        if (
            token.type === "x"
        ) {

            position++;

            return {
                1: 1
            };

        }


        if (
            token.type === "("
        ) {

            position++;

            let result =
                parseExpression();


            consume(")");


            return result;

        }


        throw new Error(
            "Expected expression"
        );

    }


    // ----------------------------
    // Powers
    // ----------------------------

    function parsePower() {

        let base =
            parsePrimary();


        if (
            peek() &&
            peek().type === "^"
        ) {

            consume("^");


            let exponentToken =
                consume("number");


            let exponent =
                exponentToken.value;


            if (
                !Number.isInteger(
                    exponent
                ) ||
                exponent < 0 ||
                exponent > 10
            ) {

                throw new Error(
                    "Invalid exponent"
                );

            }


            base =
                powerPolynomial(
                    base,
                    exponent
                );

        }


        return base;

    }


    // ----------------------------
    // Multiplication / Division
    // ----------------------------

    function parseMultiplication() {

        let result =
            parseUnary();


        while (
            peek() &&
            (
                peek().type === "*" ||
                peek().type === "/"
            )
        ) {

            let operator =
                peek().type;

            position++;


            let right =
                parseUnary();


            if (operator === "*") {

                result =
                    multiplyPolynomials(
                        result,
                        right
                    );

            } else {

                /*
                Division is only allowed
                by a constant.
                */

                let powers =
                    Object.keys(right);


                if (
                    powers.length !== 1 ||
                    powers[0] !== "0"
                ) {

                    throw new Error(
                        "Division by algebraic expression"
                    );

                }


                let divisor =
                    right[0];


                if (divisor === 0) {

                    throw new Error(
                        "Division by zero"
                    );

                }


                for (
                    let power in result
                ) {

                    result[power] /=
                        divisor;

                }

            }

        }


        return cleanPolynomial(result);

    }


    // ----------------------------
    // Unary + / -
    // ----------------------------

    function parseUnary() {

        if (
            peek() &&
            peek().type === "+"
        ) {

            position++;

            return parseUnary();

        }


        if (
            peek() &&
            peek().type === "-"
        ) {

            position++;


            let result =
                parseUnary();


            let negative = {};


            for (
                let power in result
            ) {

                negative[power] =
                    -result[power];

            }


            return negative;

        }


        return parsePower();

    }


    // ----------------------------
    // Addition / subtraction
    // ----------------------------

    function parseExpression() {

        let result =
            parseMultiplication();


        while (
            peek() &&
            (
                peek().type === "+" ||
                peek().type === "-"
            )
        ) {

            let operator =
                peek().type;

            position++;


            let right =
                parseMultiplication();


            if (operator === "+") {

                result =
                    addPolynomials(
                        result,
                        right
                    );

            } else {

                result =
                    subtractPolynomials(
                        result,
                        right
                    );

            }

        }


        return cleanPolynomial(result);

    }


    let result =
        parseExpression();


    if (
        position !== tokens.length
    ) {

        throw new Error(
            "Unexpected remaining tokens"
        );

    }


    return cleanPolynomial(result);

}


// ==================================================
// POLYNOMIAL COMPARISON
// ==================================================

function polynomialsEqual(a, b) {

    // Compare coefficients by powers of x.
    // This means:
    //   x² + 2x  -> {2:1, 1:2}
    //   x + 2 + 2x + 1 -> {1:3, 0:3}
    // These are NOT equal.
    //
    // But:
    //   x² + 2x + 1
    //   (x+1)(x+1)
    // are equal after expansion.
    a =
        cleanPolynomial(a);

    b =
        cleanPolynomial(b);


    let powers =
        new Set([
            ...Object.keys(a),
            ...Object.keys(b)
        ]);


    for (let power of powers) {

        let valueA =
            a[power] || 0;

        let valueB =
            b[power] || 0;


        if (
            Math.abs(
                valueA - valueB
            ) > 0.000001
        ) {

            return false;

        }

    }


    return true;

}


// ==================================================
// CHECK NUMERICAL ANSWER
// ==================================================

function checkNumericalAnswer(
    userAnswer,
    correctAnswer
) {

    let user =
        Number(
            userAnswer
                .replace(/\s/g, "")
        );


    let correct =
        Number(correctAnswer);


    return (
        Number.isFinite(user) &&
        Math.abs(user - correct) < 0.000001
    );

}


// ==================================================
// CHECK SIMULTANEOUS EQUATIONS
// ==================================================

function checkPairAnswer(
    userAnswer,
    correctAnswer
) {

    let user =
        userAnswer
            .replace(/\s/g, "")
            .replace(/[()]/g, "")
            .split(",");


    let correct =
        correctAnswer
            .split(",");


    if (
        user.length !== 2
    ) {

        return false;

    }


    return (

        checkNumericalAnswer(
            user[0],
            correct[0]
        )

        &&

        checkNumericalAnswer(
            user[1],
            correct[1]
        )

    );

}


// ==================================================
// MASTER ANSWER CHECKER
// ==================================================

function checkAnswer(
    userAnswer
) {

    // Normalize common maths typing variants before checking.
    userAnswer =
        userAnswer
            .replace(/[−–—]/g, "-")
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/\s+/g, "");

    if (
        currentQuestion.type ===
        "number"
    ) {

        return checkNumericalAnswer(
            userAnswer,
            currentQuestion.answer
        );

    }


    if (
        currentQuestion.type ===
        "pair"
    ) {

        return checkPairAnswer(
            userAnswer,
            currentQuestion.answer
        );

    }


    if (
        currentQuestion.type ===
        "polynomial"
    ) {

        try {

            let userPolynomial =
                parsePolynomial(
                    userAnswer
                );


            let correctPolynomial =
                parsePolynomial(
                    currentQuestion.answer
                );


            return polynomialsEqual(
                userPolynomial,
                correctPolynomial
            );

        }

        catch (error) {

            return false;

        }

    }


    return false;

}


// ==================================================
// GET TOPIC NAME
// ==================================================

function getTopicName() {

    const names = {

        linear:
            "Linear Equations",

        simultaneous:
            "Simultaneous Equations",

        expansion:
            "Expansion",

        factorisation:
            "Factorisation",

        rounding:
            "Rounding Numbers"

    };


    return names[
        currentTopic
    ];

}


// ==================================================
// GENERATE QUESTION
// ==================================================

function generateQuestion() {

    alreadyAnswered = false;


    document.getElementById(
        "answer"
    ).value = "";


    document.getElementById(
        "feedback"
    ).innerHTML = "";


    if (
        currentTopic ===
        "linear"
    ) {

        currentQuestion =
            generateLinearQuestion();

    }


    else if (
        currentTopic ===
        "simultaneous"
    ) {

        currentQuestion =
            generateSimultaneousQuestion();

    }


    else if (
        currentTopic ===
        "expansion"
    ) {

        currentQuestion =
            generateExpansionQuestion();

    }


    else if (currentTopic === "factorisation") {

        currentQuestion =
            generateFactorisationQuestion();

    }

    else {

        currentQuestion =
            generateRoundingQuestion();

    }


    document.getElementById(
        "question"
    ).innerHTML =
        currentQuestion.question;


    document.getElementById(
        "topicName"
    ).textContent =
        getTopicName();


    document.getElementById(
        "answer"
    ).focus();

}


// ==================================================
// UPDATE STATISTICS
// ==================================================

function updateStats() {

    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "streak"
    ).textContent =
        streak;


    document.getElementById(
        "correct"
    ).textContent =
        correct;


    document.getElementById(
        "questions"
    ).textContent =
        questions;

}


// ==================================================
// SUBMIT ANSWER
// ==================================================

document
    .getElementById("answerForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            if (alreadyAnswered) {

                return;

            }


            let userAnswer =
                document
                    .getElementById("answer")
                    .value
                    .trim();


            if (!userAnswer) {

                document
                    .getElementById("feedback")
                    .innerHTML =
                    "<span class='incorrect'>" +
                    "Please enter an answer." +
                    "</span>";

                return;

            }


            let feedback =
                document.getElementById(
                    "feedback"
                );

            let isCorrect = false;

            try {
                isCorrect = checkAnswer(userAnswer);
            } catch (error) {
                isCorrect = false;
                console.error("Answer checker error:", error);
            }

            alreadyAnswered = true;
            questions++;

            if (isCorrect) {

                // ==========================
                // CORRECT
                // ==========================

                correct++;

                streak++;


                let points =
                    10 * currentLevel +
                    Math.min(
                        streak,
                        5
                    ) * 2;


                score += points;


                feedback.innerHTML =

                    "<span class='correct'>" +

                    "✓ Correct! +" +

                    points +

                    " points" +

                    "</span>";

            }


            else {

                // ==========================
                // INCORRECT
                // ==========================

                streak = 0;


                feedback.innerHTML =

                    "<span class='incorrect'>" +

                    "✗ Not quite.<br>" +

                    "Correct answer: " +

                    "<strong>" +

                    currentQuestion.answer +

                    "</strong>" +

                    "</span>";

            }


            updateStats();

        }
    );


// ==================================================
// NEW QUESTION
// ==================================================

document
    .getElementById("newQuestion")
    .addEventListener(
        "click",
        generateQuestion
    );

// ==================================================
// KEYBOARD SHORTCUT: NEXT QUESTION
// Alt + Right Arrow works even while the answer box is focused.
// N works when the user is not typing in a form field.
// ==================================================
document.addEventListener("keydown", function(event) {
    if (event.repeat || event.ctrlKey || event.metaKey || event.shiftKey) return;

    const active = document.activeElement;
    const isTypingField = active && (
        active.matches("input, textarea, select") || active.isContentEditable
    );

    const altRight = event.altKey && event.key === "ArrowRight";
    const nShortcut = !event.altKey && !isTypingField && event.key.toLowerCase() === "n";

    if (altRight || nShortcut) {
        event.preventDefault();
        generateQuestion();
        document.getElementById("answer").focus();
    }
});


// ==================================================
// TOPIC BUTTONS
// ==================================================

document
    .querySelectorAll(".topic-button")
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".topic-button"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    button.classList
                        .add("active");


                    currentTopic =
                        button.dataset.topic;


                    generateQuestion();

                }
            );

        }
    );


// ==================================================
// LEVEL BUTTONS
// ==================================================

document
    .querySelectorAll(".level-button")
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".level-button"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    button.classList
                        .add("active");


                    currentLevel =
                        Number(
                            button.dataset.level
                        );


                    generateQuestion();

                }
            );

        }
    );


// ==================================================
// START GAME
// ==================================================

updateStats();

generateQuestion();

</script>
